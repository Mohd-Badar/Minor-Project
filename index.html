<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <!-- Display -->
        <div class="display">
            0
        </div>

        <!-- Buttons -->
        <div class="buttons">

            <button class="clear">AC</button>
            <button class="operator">%</button>
            <button class="operator">÷</button>
            <button class="operator">×</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">−</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">+</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="equal">=</button>

            <button class="zero">0</button>
            <button>.</button>

        </div>

        
    <div class="team">
    <h3>Calculator</h3>
    <p>Team Members</p>

    <div class="members">
        <span>Mohd Badar</span>
        <span>Tanish Yadav</span>
        <span>Nikhil Kumar</span>
        <span>Madhur Jain</span>
    </div>

    </div>

</div>

    <script src="script.js"></script>

</body>
</html>
